; One firmware per env. `pio run` builds all firmware; `pio run -e bridge -t upload` flashes one.
; `pio test -e native` runs the host-side unit tests.

[platformio]
default_envs = bridge, gadget_sample

[esp32]
; 6.x = Arduino core 2.x (TWAI + classic esp_now callback API)
platform = espressif32 @ 6.13.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:bridge]
extends = esp32
build_src_filter = +<bridge/>
; MrDIY CAN shield v1.3 pins (v1.0-v1.2 swap RX/TX)
build_flags =
    -DCAN_RX_PIN=4
    -DCAN_TX_PIN=5

[env:gadget_sample]
extends = esp32
build_src_filter = +<gadget_sample/>
; Set to the mesh_id the bridge prints at boot to ignore other bridges. 0 = accept any.
build_flags = -DMESH_ID=0

[env:native]
platform = native
test_framework = unity
; match the ESP32 core (gnu++11) so host tests compile under the same rules as firmware
build_flags = -std=gnu++11
